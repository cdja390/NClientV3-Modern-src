name: Feature request · 功能建议
description: Suggest a change to the app or its documentation
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions in English or Chinese are welcome. 欢迎用中文或英文提建议。
        [Search existing issues](https://github.com/cdja390/NClientV3-Modern-src/issues)
  - type: textarea
    id: workflow
    attributes:
      label: Workflow · 使用场景
      description: Describe what you are trying to do and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior · 建议的行为
      description: Describe what you would like the app to do.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context · 补充信息
      description: Add examples, affected sources, or workarounds if relevant.
