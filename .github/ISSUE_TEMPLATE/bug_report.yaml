name: Bug report · 问题反馈
description: Report a problem with the Android app or its documentation
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Reports in English or Chinese are welcome. 欢迎用中文或英文反馈。
        [Search existing issues](https://github.com/cdja390/NClientV3-Modern-src/issues) · [Installation and upgrade](https://github.com/cdja390/NClientV3-Modern-src#下载与升级) · [Private security reports](https://github.com/cdja390/NClientV3-Modern-src/security/advisories/new)
  - type: input
    id: app-version
    attributes:
      label: App version · 应用版本
      description: For app issues, use the version shown in Settings.
      placeholder: 4.7.2-Modern (470200)
  - type: input
    id: device
    attributes:
      label: Device and Android version · 机型和系统版本
      description: Include your device and Android version for an app issue.
      placeholder: Xiaomi 13, Android 15
  - type: dropdown
    id: sources
    attributes:
      label: Selected sources · 已选来源
      options:
        - NH
        - EH
        - EX
        - NH + EH
        - NH + EX
        - Unknown or unrelated · 不确定或无关
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and observed result · 复现步骤与实际结果
      description: Include the screen, sort order or filters, and what happens after each relevant step.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result · 预期结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots and logs · 截图与日志
      description: Remove cookies, tokens, account details, and personal paths before attaching files.
