name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK Platform 36 and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android 9+ APKs and run unit tests
        run: ./gradlew --no-daemon --console=plain assemblePost28Debug testPost28DebugUnitTest assemblePost28Release

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: post28-debug-unit-tests
          path: |
            app/build/reports/tests/testPost28DebugUnitTest/
            app/build/test-results/testPost28DebugUnitTest/
          retention-days: 14

      # Existing lint findings are reported with abortOnError disabled.
      - name: Run Android lint
        if: success()
        run: ./gradlew --no-daemon --console=plain lintPost28Debug

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: post28-debug-lint
          path: app/build/reports/lint-results-post28Debug.html
          retention-days: 14
