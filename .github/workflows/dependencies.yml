name: Dependency submission

on:
  workflow_dispatch:

jobs:
  dependency-submission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK Platform 36 and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          dependency-graph-exclude-configurations: '.*([aA]ndroidTest|android-test-plugin|unified-test-platform|lint|UnitTest|^test[A-Z]).*'
